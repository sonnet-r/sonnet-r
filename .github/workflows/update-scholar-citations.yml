name: Update Google Scholar citations

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scholar-citations
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read Google Scholar citations
        run: python .github/scripts/update_scholar_citations.py

      - name: Commit changed citation counts
        shell: bash
        run: |
          if git diff --quiet -- scholar-metrics.json dtsformer-citations.json; then
            echo "Citation counts are unchanged."
            exit 0
          fi
          git config user.name "sonnet-r"
          git config user.email "ikun_man@mail.tongji.edu.cn"
          git add scholar-metrics.json dtsformer-citations.json
          git commit -m "Update profile"
          git push
