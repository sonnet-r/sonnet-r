name: Update Google Scholar citations

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scholar-citations
  cancel-in-progress: true

jobs:
  update:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fetch citation metrics
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.request
          from html.parser import HTMLParser
          from pathlib import Path

          class CitationParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.capture_total = False
                  self.capture_field = None
                  self.total = None
                  self.current = None
                  self.publications = []

              def handle_starttag(self, tag, attrs):
                  attributes = dict(attrs)
                  if (
                      self.total is None
                      and tag == "td"
                      and attributes.get("class") == "gsc_rsb_std"
                  ):
                      self.capture_total = True
                  if tag == "tr" and "gsc_a_tr" in attributes.get("class", "").split():
                      self.current = {"title": "", "citations": ""}
                  if tag == "a" and self.current is not None:
                      classes = attributes.get("class", "").split()
                      if "gsc_a_at" in classes:
                          self.capture_field = "title"
                      elif "gsc_a_ac" in classes:
                          self.capture_field = "citations"

              def handle_data(self, data):
                  value = data.strip()
                  if self.capture_total and value.isdigit():
                      self.total = int(value)
                  if self.current is not None and self.capture_field and value:
                      self.current[self.capture_field] += value

              def handle_endtag(self, tag):
                  if tag == "td":
                      self.capture_total = False
                  elif tag == "a":
                      self.capture_field = None
                  elif tag == "tr" and self.current is not None:
                      if self.current["title"]:
                          self.publications.append(self.current)
                      self.current = None

          def write_badge(path, label, value, color="4285F4"):
              payload = {
                  "schemaVersion": 1,
                  "label": label,
                  "message": str(value),
                  "color": color,
              }
              Path(path).write_text(
                  json.dumps(payload, indent=2) + "\n",
                  encoding="utf-8",
              )

          url = "https://scholar.google.com/citations?user=1PY8X28AAAAJ&hl=en"
          page = None
          for attempt in range(4):
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0 Safari/537.36",
                      "Accept-Language": "en-US,en;q=0.9",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      page = response.read().decode("utf-8")
                  break
              except Exception as error:
                  if attempt == 3:
                      raise
                  print(f"Attempt {attempt + 1} failed: {error}")
                  time.sleep(5 * (2 ** attempt))

          parser = CitationParser()
          parser.feed(page)
          if parser.total is None:
              raise RuntimeError("Google Scholar citation count was not found")

          publication_counts = {
              item["title"].casefold(): int(item["citations"] or 0)
              for item in parser.publications
          }
          tracked = {
              "trda-ts-citations.json": (
                  "TRDA-TS: Text reinforcement and regularized diffusion alignment for "
                  "LLM-empowered multimodal time series forecasting"
              ),
              "dtsformer-citations.json": (
                  "DTSFormer: Decoupled temporal-spatial diffusion transformer for "
                  "enhanced long-term time series forecasting"
              ),
          }

          write_badge("scholar-citations.json", "Google Scholar Citations", parser.total)
          for path, title in tracked.items():
              key = title.casefold()
              if key not in publication_counts:
                  raise RuntimeError(f"Tracked publication was not found: {title}")
              write_badge(path, "Citations", publication_counts[key])
              print(f"{title}: {publication_counts[key]}")
          print(f"Google Scholar citations: {parser.total}")
          PY

      - name: Commit updated metric
        run: |
          if git diff --quiet -- '*-citations.json' scholar-citations.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*-citations.json' scholar-citations.json
          git commit -m "Update profile metrics"
          git push
