name: Update Google Scholar citations

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scholar-citations
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch citation count
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.request
          from html.parser import HTMLParser
          from pathlib import Path

          class CitationParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.capture = False
                  self.citations = None

              def handle_starttag(self, tag, attrs):
                  attributes = dict(attrs)
                  if (
                      self.citations is None
                      and tag == "td"
                      and attributes.get("class") == "gsc_rsb_std"
                  ):
                      self.capture = True

              def handle_data(self, data):
                  value = data.strip()
                  if self.capture and value.isdigit():
                      self.citations = int(value)

              def handle_endtag(self, tag):
                  if tag == "td":
                      self.capture = False

          url = "https://scholar.google.com/citations?user=1PY8X28AAAAJ&hl=en"
          page = None
          for attempt in range(4):
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0 Safari/537.36",
                      "Accept-Language": "en-US,en;q=0.9",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      page = response.read().decode("utf-8")
                  break
              except Exception as error:
                  if attempt == 3:
                      raise
                  print(f"Attempt {attempt + 1} failed: {error}")
                  time.sleep(5 * (2 ** attempt))

          parser = CitationParser()
          parser.feed(page)
          if parser.citations is None:
              raise RuntimeError("Google Scholar citation count was not found")

          payload = {
              "schemaVersion": 1,
              "label": "Google Scholar Citations",
              "message": str(parser.citations),
              "color": "4285F4",
          }
          Path("scholar-citations.json").write_text(
              json.dumps(payload, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"Google Scholar citations: {parser.citations}")
          PY

      - name: Commit updated metric
        run: |
          if git diff --quiet -- scholar-citations.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scholar-citations.json
          git commit -m "Update profile metrics"
          git push
